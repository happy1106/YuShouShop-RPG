<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>御獸小舖</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #171a20;
    color: #eeeeee;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 4px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.15);
}

.container {
    width: min(900px, 94vw);
    margin: auto;
    padding-bottom: 40px;
}

h1 {
    text-align: center;
    margin: 20px 0 8px;
}

h2 {
    margin-top: 8px;
}

.panel {
    background: #242933;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
}

.status {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.status div {
    background: #303642;
    padding: 8px;
    border-radius: 7px;
    text-align: center;
}

.menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
}

.menu button {
    background: #3c4655;
    color: white;
}

.card {
    background: #303642;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.enemy-card {
    cursor: pointer;
    border: 2px solid transparent;
}

.enemy-card:hover {
    border-color: #ffffff;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
}

.stat {
    background: #1c2027;
    padding: 7px;
    border-radius: 6px;
}

.element {
    display: inline-block;
    background: #3a414d;
    padding: 5px 8px;
    border-radius: 6px;
    margin: 3px;
}

.bar {
    height: 16px;
    background: #15181d;
    border-radius: 10px;
    overflow: hidden;
    margin: 5px 0 10px;
}

.bar-fill {
    height: 100%;
    width: 0%;
    background: #55b879;
}

.battle-log {
    height: 180px;
    overflow-y: auto;
    background: #111419;
    border-radius: 8px;
    padding: 10px;
    line-height: 1.7;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #303642;
    padding: 9px;
    margin: 5px 0;
    border-radius: 7px;
}

.small {
    color: #aeb6c2;
    font-size: 14px;
}

.warning {
    color: #ffcc66;
}

.good {
    color: #69d98b;
}

.danger {
    color: #ff7373;
}

.center {
    text-align: center;
}

@media (max-width: 600px) {
    .status {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid {
        grid-template-columns: 1fr;
    }

    button {
        padding: 10px 11px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 御獸小舖</h1>

<div id="app"></div>

</div>

<script>

/* =========================================================
   玩家
========================================================= */

let player = {
    gold: 100,
    realm: "新手森林"
};


/* =========================================================
   核心御獸
========================================================= */

let pet = {
    name: "寵獸",

    level: 1,
    exp: 0,
    expMax: 100,

    hp: 20,
    maxHp: 20,

    patk: 6,
    matk: 6,
    pdef: 6,
    mdef: 6,
    spd: 6,

    aptitude: 1.00,

    elements: {
        fire: 0,
        water: 0,
        wood: 0,
        ice: 0,
        thunder: 0,
        earth: 0,
        wind: 0,
        light: 0,
        dark: 0
    }
};


/* =========================================================
   元素
========================================================= */

const elementData = {

    fire: {
        name: "🔥 火",
        material: "火焰果實"
    },

    water: {
        name: "💧 水",
        material: "水靈花"
    },

    wood: {
        name: "🌿 木",
        material: "青木種子"
    },

    ice: {
        name: "❄️ 冰",
        material: "寒冰晶"
    },

    thunder: {
        name: "⚡ 雷",
        material: "雷鳴石"
    },

    earth: {
        name: "⛰️ 土",
        material: "大地礦石"
    },

    wind: {
        name: "🌪️ 風",
        material: "疾風羽"
    },

    light: {
        name: "☀️ 光",
        material: "光耀晶"
    },

    dark: {
        name: "🌑 暗",
        material: "暗影晶"
    }
};


/* =========================================================
   素材
========================================================= */

let materials = {
    fire: 0,
    water: 0,
    wood: 0,
    ice: 0,
    thunder: 0,
    earth: 0,
    wind: 0,
    light: 0,
    dark: 0
};


/* =========================================================
   野生御獸
========================================================= */

let wildPets = [];

let currentEnemy = null;

let battleActive = false;


/* =========================================================
   15種雙核心
========================================================= */

const growthCores = [

    ["hp", "patk"],
    ["hp", "matk"],
    ["hp", "pdef"],
    ["hp", "mdef"],
    ["hp", "spd"],

    ["patk", "matk"],
    ["patk", "pdef"],
    ["patk", "mdef"],
    ["patk", "spd"],

    ["matk", "pdef"],
    ["matk", "mdef"],
    ["matk", "spd"],

    ["pdef", "mdef"],
    ["pdef", "spd"],

    ["mdef", "spd"]

];


/* =========================================================
   初始化
========================================================= */

showShop();


/* =========================================================
   EXP
========================================================= */

function getExpMax(level) {

    if (level <= 10) {
        return 100 + (level - 1) * 10;
    }
    else if (level <= 20) {
        return 300 + (level - 11) * 50;
    }
    else if (level <= 30) {
        return 1000 + (level - 21) * 100;
    }
    else {
        return 4000 + (level - 31) * 500;
    }
}


function gainExp(amount) {

    pet.exp += amount;

    while (pet.exp >= pet.expMax) {

        pet.exp -= pet.expMax;

        levelUp();

        pet.expMax = getExpMax(pet.level);
    }
}


function levelUp() {

    pet.level++;

    pet.maxHp += 2;
    pet.hp = pet.maxHp;

    pet.patk++;
    pet.matk++;
    pet.pdef++;
    pet.mdef++;
    pet.spd++;

}


/* =========================================================
   元素總量
========================================================= */

function normalizeElements() {

    let total = 0;

    for (let key in pet.elements) {
        total += pet.elements[key];
    }

    if (total === 0) {
        return;
    }

    for (let key in pet.elements) {
        pet.elements[key] =
            pet.elements[key] / total * 100;
    }
}


/* =========================================================
   使用素材
========================================================= */

function useMaterial(element) {

    if (materials[element] <= 0) {
        alert("沒有這個素材！");
        return;
    }

    materials[element]--;

    let oldValue = pet.elements[element];

    if (oldValue === 0) {

        for (let key in pet.elements) {
            pet.elements[key] = 0;
        }

        pet.elements[element] = 100;

    }
    else {

        for (let key in pet.elements) {
            pet.elements[key] *= 0.90;
        }

        pet.elements[element] += 10;
    }

    normalizeElements();

    showPet();
}


/* =========================================================
   進化方向
========================================================= */

function getEvolutionType() {

    let list = Object.entries(pet.elements)
        .sort((a, b) => b[1] - a[1]);

    let top1 = list[0];
    let top2 = list[1];
    let top3 = list[2];

    if (top1[1] > 80) {

        return `${elementData[top1[0]].name} 單屬性進化`;

    }

    if (
        top1[1] > 40 &&
        top2[1] > 40 &&
        top1[1] + top2[1] > 80
    ) {

        return `${elementData[top1[0]].name} ＋ ${elementData[top2[0]].name} 雙屬性進化`;

    }

    if (
        top1[1] > 20 &&
        top2[1] > 20 &&
        top3[1] > 20 &&
        top1[1] + top2[1] + top3[1] > 80
    ) {

        return `${elementData[top1[0]].name} ＋ ${elementData[top2[0]].name} ＋ ${elementData[top3[0]].name} 三屬性進化`;

    }

    return "目前尚未形成明確進化方向";
}


/* =========================================================
   生成敵人等級
========================================================= */

function getEnemyLevel() {

    let difference =
        Math.floor(Math.random() * 5) - 2;

    let level =
        pet.level + difference;

    if (level < 1) {
        level = 1;
    }

    return level;
}


/* =========================================================
   生成野生御獸
========================================================= */

function createWildPet() {

    let level = getEnemyLevel();

    let core =
        growthCores[
            Math.floor(Math.random() * growthCores.length)
        ];

    let enemy = {

        name: randomPetName(),

        level: level,

        hp: 10 + level * 3,
        patk: 5 + level,
        matk: 5 + level,
        pdef: 5 + level,
        mdef: 5 + level,
        spd: 5 + level,

        growthCore: core,

        maxHp: 10 + level * 3
    };

    let elements = [
        "fire",
        "water",
        "wood",
        "ice",
        "thunder",
        "earth",
        "wind",
        "light",
        "dark"
    ];

    enemy.element =
        elements[
            Math.floor(Math.random() * elements.length)
        ];

    for (let stat of core) {

        if (stat === "hp") {
            enemy.hp += level * 2;
            enemy.maxHp = enemy.hp;
        }

        if (stat === "patk") enemy.patk += level;
        if (stat === "matk") enemy.matk += level;
        if (stat === "pdef") enemy.pdef += level;
        if (stat === "mdef") enemy.mdef += level;
        if (stat === "spd") enemy.spd += level;
    }

    return enemy;
}


function randomPetName() {

    let names = [
        "赤焰狼",
        "水靈狐",
        "青木鹿",
        "寒冰犬",
        "雷牙獸",
        "岩甲熊",
        "疾風貓",
        "月光兔",
        "暗影狐"
    ];

    return names[
        Math.floor(Math.random() * names.length)
    ];
}


/* =========================================================
   探索
========================================================= */

function explore() {

    wildPets = [];

    let count = 3;

    for (let i = 0; i < count; i++) {
        wildPets.push(createWildPet());
    }

    showExplore();
}


/* =========================================================
   開始戰鬥
========================================================= */

function startBattle(index) {

    currentEnemy = wildPets[index];

    battleActive = true;

    pet.hp = pet.maxHp;

    showBattle();
}


/* =========================================================
   傷害計算
========================================================= */

function calculateDamage(attacker, defender, type) {

    let attack;
    let defense;

    if (type === "physical") {

        attack = attacker.patk;
        defense = defender.pdef;

    }
    else if (type === "magic") {

        attack = attacker.matk;
        defense = defender.mdef;

    }
    else {

        return {
            damage: 0,
            reflected: false
        };
    }


    let difference = attack - defense;


    if (difference > 0) {

        return {
            damage: difference,
            reflected: false
        };

    }

    if (difference === 0) {

        return {
            damage: 0,
            reflected: false
        };

    }

    return {

        damage: 0,

        reflected: true,

        reflection: attack
    };
}


/* =========================================================
   玩家攻擊
========================================================= */

function playerAttack(type) {

    if (!battleActive) {
        return;
    }

    let result =
        calculateDamage(pet, currentEnemy, type);

    currentEnemy.hp -= result.damage;

    let message =
        `${pet.name} 使用${type === "physical" ? "物攻" : "魔攻"}，造成 ${result.damage} 點傷害。`;


    if (result.reflected) {

        pet.hp -= result.reflection;

        message +=
            ` 防禦反彈！寵獸受到 ${result.reflection} 點反傷。`;
    }


    addBattleLog(message);


    if (currentEnemy.hp <= 0) {

        victory();

        return;
    }


    if (pet.hp <= 0) {

        defeat();

        return;
    }


    enemyTurn();
}


/* =========================================================
   敵人攻擊
========================================================= */

function enemyTurn() {

    let physical =
        calculateDamage(
            currentEnemy,
            pet,
            "physical"
        );

    let magic =
        calculateDamage(
            currentEnemy,
            pet,
            "magic"
        );

    let type;

    if (physical.damage >= magic.damage) {
        type = "physical";
    }
    else {
        type = "magic";
    }

    let result =
        calculateDamage(
            currentEnemy,
            pet,
            type
        );

    pet.hp -= result.damage;

    let message =
        `${currentEnemy.name} 使用${type === "physical" ? "物攻" : "魔攻"}，造成 ${result.damage} 點傷害。`;

    if (result.reflected) {

        currentEnemy.hp -= result.reflection;

        message +=
            ` 防禦反彈！${currentEnemy.name} 受到 ${result.reflection} 點反傷。`;
    }

    addBattleLog(message);


    if (pet.hp <= 0) {

        defeat();

        return;
    }

    showBattle();
}


/* =========================================================
   防禦
========================================================= */

function defend() {

    addBattleLog(
        `${pet.name} 進入防禦狀態。`
    );

    enemyTurn();
}


/* =========================================================
   速度判定
========================================================= */

function firstTurn() {

    if (pet.spd >= currentEnemy.spd) {
        return "player";
    }

    return "enemy";
}


/* =========================================================
   勝利
========================================================= */

function victory() {

    battleActive = false;

    let exp = 20 + currentEnemy.level * 10;

    gainExp(exp);

    player.gold += 20;

    materials[currentEnemy.element]++;

    addBattleLog(
        `🎉 戰鬥勝利！獲得 ${exp} EXP、20 金幣、1 個${elementData[currentEnemy.element].material}。`
    );

    showBattleResult("勝利");
}


/* =========================================================
   失敗
========================================================= */

function defeat() {

    battleActive = false;

    pet.hp = 0;

    showBattleResult("敗北");
}


/* =========================================================
   戰鬥紀錄
========================================================= */

let logs = [];

function addBattleLog(text) {

    logs.push(text);

    if (logs.length > 20) {
        logs.shift();
    }
}


/* =========================================================
   商店畫面
========================================================= */

function showShop() {

    document.getElementById("app").innerHTML = `

        <div class="panel">

            <h2>🏪 御獸小舖</h2>

            <p>
                金幣：💰 ${player.gold}
            </p>

            <div class="menu">

                <button onclick="showPet()">
                    🐶 查看寵獸
                </button>

                <button onclick="explore()">
                    🗺️ 秘境探索
                </button>

                <button onclick="showMaterials()">
                    🎒 素材庫
                </button>

            </div>

        </div>

        <div class="panel">

            <h2>今日公告</h2>

            <p>
                歡迎來到御獸小舖。
            </p>

            <p class="small">
                去秘境尋找素材，培養你的核心御獸。
            </p>

        </div>
    `;
}


/* =========================================================
   寵獸畫面
========================================================= */

function showPet() {

    let elementHTML = "";

    for (let key in pet.elements) {

        if (pet.elements[key] > 0.01) {

            elementHTML += `
                <span class="element">
                    ${elementData[key].name}
                    ${pet.elements[key].toFixed(1)}%
                </span>
            `;
        }
    }


    let expPercent =
        pet.exp / pet.expMax * 100;


    let materialButtons = "";

    for (let key in materials) {

        materialButtons += `

            <div class="item">

                <span>
                    ${elementData[key].name}
                    ${elementData[key].material}
                    ×${materials[key]}
                </span>

                <button
                    onclick="useMaterial('${key}')"
                    ${materials[key] <= 0 ? "disabled" : ""}
                >
                    使用
                </button>

            </div>
        `;
    }


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="showShop()">← 返回小舖</button>

            <h2>🐶 ${pet.name}</h2>

            <p>
                Lv.${pet.level}
               　
                EXP ${pet.exp} / ${pet.expMax}
            </p>

            <div class="bar">
                <div
                    class="bar-fill"
                    style="width:${expPercent}%"
                ></div>
            </div>

        </div>


        <div class="panel">

            <h2>📊 六圍</h2>

            <div class="stat-grid">

                <div class="stat">❤️ 生命：${pet.hp} / ${pet.maxHp}</div>
                <div class="stat">⚔️ 物理攻擊：${pet.patk}</div>

                <div class="stat">🔮 魔法攻擊：${pet.matk}</div>
                <div class="stat">🛡️ 物理防禦：${pet.pdef}</div>

                <div class="stat">🧿 魔法防禦：${pet.mdef}</div>
                <div class="stat">💨 速度：${pet.spd}</div>

            </div>

        </div>


        <div class="panel">

            <h2>🧬 資質</h2>

            <p>
                固定資質：${pet.aptitude.toFixed(2)}
            </p>

            <p class="small">
                資質決定成長效率，正常培育無法改變。
            </p>

        </div>


        <div class="panel">

            <h2>🌟 元素傾向</h2>

            ${elementHTML}

            <hr>

            <p>
                <strong>
                    目前進化方向：
                </strong>
            </p>

            <p class="warning">
                ${getEvolutionType()}
            </p>

        </div>


        <div class="panel">

            <h2>🧪 使用素材</h2>

            ${materialButtons}

        </div>
    `;
}


/* =========================================================
   素材庫
========================================================= */

function showMaterials() {

    let html = "";

    for (let key in materials) {

        html += `

            <div class="item">

                <span>
                    ${elementData[key].name}
                    ${elementData[key].material}
                </span>

                <strong>
                    ×${materials[key]}
                </strong>

            </div>
        `;
    }


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="showShop()">
                ← 返回小舖
            </button>

            <h2>🎒 素材庫</h2>

            ${html}

        </div>
    `;
}


/* =========================================================
   探索畫面
========================================================= */

function showExplore() {

    let cards = "";

    wildPets.forEach((enemy, index) => {

        let coreNames =
            enemy.growthCore
                .map(statName)
                .join(" ＋ ");


        cards += `

            <div
                class="card enemy-card"
                onclick="startBattle(${index})"
            >

                <h3>
                    ${enemy.name}
                </h3>

                <p>
                    Lv.${enemy.level}
                </p>

                <p>
                    ${elementData[enemy.element].name}
                </p>

                <div class="stat-grid">

                    <div class="stat">
                        ❤️ ${enemy.hp}
                    </div>

                    <div class="stat">
                        ⚔️ ${enemy.patk}
                    </div>

                    <div class="stat">
                        🔮 ${enemy.matk}
                    </div>

                    <div class="stat">
                        🛡️ ${enemy.pdef}
                    </div>

                    <div class="stat">
                        🧿 ${enemy.mdef}
                    </div>

                    <div class="stat">
                        💨 ${enemy.spd}
                    </div>

                </div>

                <p class="small">
                    成長核心：${coreNames}
                </p>

                <button>
                    選擇
                </button>

            </div>
        `;
    });


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="showShop()">
                ← 返回小舖
            </button>

            <h2>🗺️ 新手森林</h2>

            <p class="small">
                發現了 ${wildPets.length} 隻野生御獸。
                選擇一隻開始戰鬥。
            </p>

        </div>

        <div class="grid">
            ${cards}
        </div>

        <div class="center">

            <button onclick="explore()">
                🔄 重新探索
            </button>

        </div>
    `;
}


/* =========================================================
   六圍名稱
========================================================= */

function statName(stat) {

    const names = {

        hp: "生命",

        patk: "物理攻擊",

        matk: "魔法攻擊",

        pdef: "物理防禦",

        mdef: "魔法防禦",

        spd: "速度"

    };

    return names[stat];
}


/* =========================================================
   戰鬥畫面
========================================================= */

function showBattle() {

    let playerFirst =
        firstTurn() === "player";


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <h2>⚔️ 戰鬥</h2>

            <div class="grid">

                <div class="card">

                    <h3>
                        🐶 ${pet.name}
                    </h3>

                    <p>
                        Lv.${pet.level}
                    </p>

                    <p>
                        ❤️ ${Math.max(0, pet.hp)}
                        / ${pet.maxHp}
                    </p>

                    <p>
                        💨 速度：${pet.spd}
                    </p>

                </div>


                <div class="card">

                    <h3>
                        👾 ${currentEnemy.name}
                    </h3>

                    <p>
                        Lv.${currentEnemy.level}
                    </p>

                    <p>
                        ❤️ ${Math.max(0, currentEnemy.hp)}
                        / ${currentEnemy.maxHp}
                    </p>

                    <p>
                        💨 速度：${currentEnemy.spd}
                    </p>

                </div>

            </div>

            <p class="${playerFirst ? "good" : "warning"}">

                ${playerFirst
                    ? "⚡ 你的速度較快，你先行動。"
                    : "⚡ 敵人的速度較快，敵人先行動。"}

            </p>

        </div>


        <div class="panel">

            <h3>🎮 行動</h3>

            <button onclick="playerAttack('physical')">
                ⚔️ 物攻
            </button>

            <button onclick="playerAttack('magic')">
                🔮 魔攻
            </button>

            <button onclick="defend()">
                🛡️ 防禦
            </button>

        </div>


        <div class="panel">

            <h3>📜 戰鬥紀錄</h3>

            <div class="battle-log">

                ${logs.join("<br>")}

            </div>

        </div>
    `;
}


/* =========================================================
   戰鬥結果
========================================================= */

function showBattleResult(result) {

    document.getElementById("app").innerHTML = `

        <div class="panel center">

            <h1>
                ${result === "勝利" ? "🎉 戰鬥勝利！" : "💀 戰鬥失敗"}
            </h1>

            ${
                result === "勝利"
                ?
                `
                <p>
                    獲得 EXP、金幣與元素素材。
                </p>

                <button onclick="explore()">
                    🗺️ 繼續探索
                </button>
                `
                :
                `
                <p>
                    寵獸倒下了。
                </p>

                <button onclick="restartGame()">
                    🔄 重新開始
                </button>
                `
            }

            <button onclick="showShop()">
                🏪 回到小舖
            </button>

        </div>

        <div class="panel">

            <h3>📜 戰鬥紀錄</h3>

            <div class="battle-log">
                ${logs.join("<br>")}
            </div>

        </div>
    `;
}


/* =========================================================
   重新開始
========================================================= */

function restartGame() {

    location.reload();

}

</script>

</body>
</html>
