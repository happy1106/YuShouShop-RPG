<!DOCTYPE html>
<html>
<head><title>御獸小舖 RPG</title></head>
<body>
    <!-- 遊戲首頁 -->
    <h1>御獸小舖 RPG</h1>
    <p>歡迎來到御獸世界！</p>
    <button onclick="sayHello()">開始遊戲</button>
<script>
// 主角資料
let character = {
    name: "小犬",    level: 1,    exp: 0,    expMax: 100,
    hp: 6,    patk: 6,    matk: 6,    pdef: 6,    mdef: 6,    spd: 6    }    ;
let enemy     = {
    name: "赤焰狼",    level: 1,
    hp: 10,    patk: 7,    matk: 5,    pdef: 6,    mdef: 5,   spd: 8    }    ;
// 顯示主角資料
function showDog() {
document.body.innerHTML = `
    <h1>我的小犬</h1>
    <p>    Lv ：${character.level}</p>
    <p>    EXP：${character. exp}  /  ${character.expMax}</p>
    <p id="characterHp">❤️ 生命：${character.hp}</p>
    <p>⚔️ 物攻：${character.patk}</p>
    <p>🔮 魔攻：${character.matk}</p>
    <p>🛡️ 物防：${character.pdef}</p>
    <p>🧿 魔防：${character.mdef}</p>
    <p>💨 速度：${character. spd}</p>
    <button onclick="gainExp(10); showDog()">獲得 10 EXP</button>

<hr>
    <h2>野生寵獸</h2>
    <p>${enemy.name} Lv.${enemy.level}</p>
    <p>❤️ 生命：${enemy.  hp}</p>
    <p>⚔️ 物攻：${enemy.patk}</p>
    <p>🔮 魔攻：${enemy.matk}</p>
    <p>🛡️ 物防：${enemy.pdef}</p>
    <p>🧿 魔防：${enemy.mdef}</p>
    <p>💨 速度：${enemy. spd}</p>
    <button onclick="startBattle()">開始戰鬥</button>            `;    }

function startBattle() {
document.body.innerHTML = `
    <h1>戰鬥開始！</h1>
    
    <h2>${character.name}  Lv.${character.level}</h2>
    <p>❤️ 生命：${character.hp}</p>
    <hr>
    <h2>${enemy.name}      Lv.${enemy.level}    </h2>
    <p id="enemyHp">❤️ 生命：${enemy.hp}</p>

    <p id="battleMessage">請選擇行動</p>

<hr>
  <button onclick="attack(character, enemy, 'physical' )">物攻</button>
  <button onclick="attack(character, enemy, 'magic'    )">魔攻</button>
  <button onclick="defend         (                    )">防禦</button>
  <button onclick="escape         (                    )">逃跑</button> `;    }
startTurn();}

function enemyTurn() {
    let enemyType = chooseEnemyAttack();
    attack(enemy, character, enemyType)  ;  }  
  
function startTurn() {
  let firstAttacker = decideFirstAttacker();
  if   (firstAttacker === character) {
        document.getElementById("battleMessage").innerHTML
        = `${character.name}  先攻！`;                }
  else {document.getElementById("battleMessage").innerHTML
        = `${enemy.name}      先攻！`;    enemyTurn();}  }    
    
 function attack(attacker, defender, type) {
    let attack;    let defense;  let message;
    if     (type === "physical" ) {
        attack = attacker.patk; defense = defender.pdef;  message = "物理";    }
    else if(type === "magic"    ) {
        attack = attacker.matk; defense = defender.mdef;  message = "魔法";    }
    else {    return        ;    }
    let damage = calculateDamage(attack, defense);    defender.hp -= damage;
  document.getElementById("enemyHp"      ).innerHTML =
        `❤️ 生命：${enemy.hp}            `;
  document.getElementById("characterHp"  ).innerHTML =
        `❤️ 生命：${character.hp}        `;
  document.getElementById("battleMessage").innerHTML =
        `${attacker.name} 對 ${defender.name} 造成 ${damage} 點${message}傷害！`;}
    if (attacker === character) {
    let enemyType = chooseEnemyAttack();attack(enemy, character, enemyType)    ;}

 function decideFirstAttacker() {
    if      (character.spd > enemy.spd) {return character;  }
    else if (enemy.spd > character.spd) {return enemy    ;  }
    else                                {return character;  }   

    

function calculateDamage(attack, defense) {
    let damage = attack - defense;
    if (damage < 0) {        damage = 0;  }
    return damage                      ;  }
function chooseEnemyAttack() {
    let physicalDamage  = calculateDamage(enemy.patk, character.pdef);
    let magicDamage     = calculateDamage(enemy.matk, character.mdef);
    if (physicalDamage >= magicDamage) {return "physical";    }
    else                               {return "magic"   ;    }}
    
  
// 開始遊戲
function sayHello() {        showDog();    }
// 主角升級
function getExpMax(level) {
    if (level <= 10) {        return  100 + (level -  1) *  10;    }
    if (level <= 20) {        return  300 + (level - 11) *  50;    }
    if (level <= 30) {        return 1000 + (level - 21) * 100;    }
                              return 4000 + (level - 31) * 500;    } 
function gainExp(amount) {
    character.exp += amount;
    if (character.exp >= character.expMax) {
        character.exp -= character.expMax;
        levelUp();
        character.expMax = getExpMax(character.level)        ;    }    showDog()    ;    }
function levelUp() {
    character.level += 1;
    character.   hp += 1; character.patk += 1; character.matk += 1;
    character. pdef += 1; character.mdef += 1; character. spd += 1;    showDog()    ;    }

</script></body></html>
