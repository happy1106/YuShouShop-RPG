<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>御獸小舖</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #171a20;
    color: #eeeeee;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 4px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.15);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.container {
    width: min(900px, 94vw);
    margin: auto;
    padding-bottom: 40px;
}

h1 {
    text-align: center;
    margin: 20px 0 8px;
}

h2 {
    margin-top: 8px;
}

.panel {
    background: #242933;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
}

.menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
}

.menu button {
    background: #3c4655;
    color: white;
}

.card {
    background: #303642;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.enemy-card {
    border: 2px solid transparent;
}

.enemy-card:hover {
    border-color: #ffffff;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
}

.stat {
    background: #1c2027;
    padding: 7px;
    border-radius: 6px;
}

.element {
    display: inline-block;
    background: #3a414d;
    padding: 5px 8px;
    border-radius: 6px;
    margin: 3px;
}

.bar {
    height: 16px;
    background: #15181d;
    border-radius: 10px;
    overflow: hidden;
    margin: 5px 0 10px;
}

.bar-fill {
    height: 100%;
    background: #55b879;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #303642;
    padding: 9px;
    margin: 5px 0;
    border-radius: 7px;
}

.battle-log {
    height: 200px;
    overflow-y: auto;
    background: #111419;
    border-radius: 8px;
    padding: 10px;
    line-height: 1.7;
}

.small {
    color: #aeb6c2;
    font-size: 14px;
}

.warning {
    color: #ffcc66;
}

.good {
    color: #69d98b;
}

.danger {
    color: #ff7373;
}

.center {
    text-align: center;
}

.realm-button {
    width: 100%;
    text-align: left;
    background: #303642;
    color: white;
    padding: 14px;
}

.realm-button strong {
    font-size: 17px;
}

.realm-button span {
    display: block;
    margin-top: 4px;
    color: #aeb6c2;
}

.growth {
    color: #7ed6ff;
    font-weight: bold;
}

.reward {
    background: #303642;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
}

@media (max-width: 600px) {

    .grid {
        grid-template-columns: 1fr;
    }

    button {
        padding: 10px 11px;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>🐾 御獸小舖</h1>

<div id="app"></div>

</div>

<script>


/* =========================================================
   玩家
========================================================= */

let player = {

    gold: 100

};


/* =========================================================
   核心御獸
========================================================= */

let pet = {

    name: "寵獸",

    level: 1,

    exp: 0,

    expMax: 100,

    hp: 20,

    maxHp: 20,

    patk: 8,

    matk: 8,

    pdef: 8,

    mdef: 8,

    spd: 8,

    aptitude: 1.00,

    elements: {

        fire: 0,

        water: 0,

        wood: 0,

        ice: 0,

        thunder: 0,

        earth: 0,

        wind: 0,

        light: 0,

        dark: 0

    }

};


/* =========================================================
   九大元素
========================================================= */

const elementData = {

    fire: {
        name: "🔥 火",
        realm: "🔥 火焰秘境",
        material: "火焰果實"
    },

    water: {
        name: "💧 水",
        realm: "💧 水靈秘境",
        material: "水靈花"
    },

    wood: {
        name: "🌿 木",
        realm: "🌿 青木秘境",
        material: "青木種子"
    },

    ice: {
        name: "❄️ 冰",
        realm: "❄️ 寒冰秘境",
        material: "寒冰晶"
    },

    thunder: {
        name: "⚡ 雷",
        realm: "⚡ 雷鳴秘境",
        material: "雷鳴石"
    },

    earth: {
        name: "⛰️ 土",
        realm: "⛰️ 大地秘境",
        material: "大地礦石"
    },

    wind: {
        name: "🌪️ 風",
        realm: "🌪️ 疾風秘境",
        material: "疾風羽"
    },

    light: {
        name: "☀️ 光",
        realm: "☀️ 聖光秘境",
        material: "光耀晶"
    },

    dark: {
        name: "🌑 暗",
        realm: "🌑 暗影秘境",
        material: "暗影晶"
    }

};


/* =========================================================
   素材
========================================================= */

let materials = {

    fire: 0,

    water: 0,

    wood: 0,

    ice: 0,

    thunder: 0,

    earth: 0,

    wind: 0,

    light: 0,

    dark: 0

};


/* =========================================================
   15種雙核心
========================================================= */

const growthCores = [

    ["hp", "patk"],
    ["hp", "matk"],
    ["hp", "pdef"],
    ["hp", "mdef"],
    ["hp", "spd"],

    ["patk", "matk"],
    ["patk", "pdef"],
    ["patk", "mdef"],
    ["patk", "spd"],

    ["matk", "pdef"],
    ["matk", "mdef"],
    ["matk", "spd"],

    ["pdef", "mdef"],
    ["pdef", "spd"],

    ["mdef", "spd"]

];


/* =========================================================
   九大秘境
========================================================= */

const realms = [

    "fire",
    "water",
    "wood",
    "ice",
    "thunder",
    "earth",
    "wind",
    "light",
    "dark"

];


/* =========================================================
   遊戲狀態
========================================================= */

let currentRealm = null;

let wildPets = [];

let currentEnemy = null;

let currentEnemyIndex = -1;

let battleActive = false;

let logs = [];


/* =========================================================
   啟動
========================================================= */

showShop();


/* =========================================================
   小舖
========================================================= */

function showShop() {

    document.getElementById("app").innerHTML = `

        <div class="panel">

            <h2>🏪 御獸小舖</h2>

            <p>
                💰 金幣：${player.gold}
            </p>

            <div class="menu">

                <button onclick="showPet()">
                    🐶 查看寵獸
                </button>

                <button onclick="showRealms()">
                    🗺️ 秘境探索
                </button>

                <button onclick="showMaterials()">
                    🎒 素材庫
                </button>

            </div>

        </div>

        <div class="panel">

            <h2>📖 小舖公告</h2>

            <p>
                你的核心御獸只有一隻。
            </p>

            <p class="small">
                前往不同秘境尋找素材，
                再利用素材培養寵獸的元素傾向。
            </p>

        </div>

    `;

}


/* =========================================================
   秘境選擇
========================================================= */

function showRealms() {

    let html = "";


    for (let realm of realms) {

        html += `

            <button
                class="realm-button"
                onclick="enterRealm('${realm}')"
            >

                <strong>
                    ${elementData[realm].realm}
                </strong>

                <span>
                    主要素材：
                    ${elementData[realm].material}
                </span>

            </button>

        `;

    }


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="showShop()">
                ← 返回小舖
            </button>

            <h2>🗺️ 秘境選擇</h2>

            <p class="small">
                選擇你想探索的元素秘境。
            </p>

            ${html}

        </div>

    `;

}


/* =========================================================
   進入秘境
========================================================= */

function enterRealm(element) {

    currentRealm = element;

    wildPets = [];


    let availableCores =
        [...growthCores];


    /*
        每個秘境固定出現5隻御獸。

        5隻御獸的成長核心不重複。
    */

    for (let i = 0; i < 5; i++) {

        let randomIndex =
            Math.floor(
                Math.random() *
                availableCores.length
            );


        let selectedCore =
            availableCores.splice(
                randomIndex,
                1
            )[0];


        wildPets.push(
            createWildPet(
                element,
                selectedCore
            )
        );

    }


    showWildPets();

}


/* =========================================================
   建立野生御獸
========================================================= */

function createWildPet(
    element,
    growthCore
) {

    /*
        敵人等級：

        主角等級 -2 ～ +2
    */

    let difference =
        Math.floor(
            Math.random() * 5
        ) - 2;


    let level =
        pet.level +
        difference;


    if (level < 1) {

        level = 1;

    }


    /*
        Lv1基礎數值
    */

    let hp = 12;

    let patk = 5;

    let matk = 5;

    let pdef = 5;

    let mdef = 5;

    let spd = 5;


    let levelUpCount =
        level - 1;


    /*
        敵人升級

        HP核心：
        +3

        非HP核心：
        +2


        攻擊、防禦：

        核心 +2
        非核心 +1


        速度：

        核心 +2
        非核心 +1
    */

    for (
        let i = 0;
        i < levelUpCount;
        i++
    ) {


        if (
            growthCore.includes("hp")
        ) {

            hp += 3;

        }
        else {

            hp += 2;

        }


        if (
            growthCore.includes("patk")
        ) {

            patk += 2;

        }
        else {

            patk += 1;

        }


        if (
            growthCore.includes("matk")
        ) {

            matk += 2;

        }
        else {

            matk += 1;

        }


        if (
            growthCore.includes("pdef")
        ) {

            pdef += 2;

        }
        else {

            pdef += 1;

        }


        if (
            growthCore.includes("mdef")
        ) {

            mdef += 2;

        }
        else {

            mdef += 1;

        }


        if (
            growthCore.includes("spd")
        ) {

            spd += 2;

        }
        else {

            spd += 1;

        }

    }


    const names = {

        fire: [
            "赤焰狼",
            "炎尾狐",
            "火甲熊",
            "熔岩犬",
            "火羽鳥"
        ],

        water: [
            "水靈狐",
            "碧波龜",
            "潮汐鹿",
            "水刃魚",
            "寒泉獸"
        ],

        wood: [
            "青木鹿",
            "森林兔",
            "藤蔓蛇",
            "木靈狐",
            "森之犬"
        ],

        ice: [
            "寒冰犬",
            "冰晶狐",
            "雪原狼",
            "霜角鹿",
            "冰甲獸"
        ],

        thunder: [
            "雷牙獸",
            "雷鳴狼",
            "閃電狐",
            "雷角鹿",
            "電光犬"
        ],

        earth: [
            "岩甲熊",
            "大地龜",
            "岩石犬",
            "山嶽獸",
            "土靈鹿"
        ],

        wind: [
            "疾風貓",
            "風羽鳥",
            "迅風狼",
            "旋風狐",
            "飛羽獸"
        ],

        light: [
            "月光兔",
            "聖光鹿",
            "光羽鳥",
            "耀光犬",
            "晨曦狐"
        ],

        dark: [
            "暗影狐",
            "夜刃狼",
            "幽影犬",
            "暗月貓",
            "黑霧獸"
        ]

    };


    let list =
        names[element];


    let name =
        list[
            Math.floor(
                Math.random() *
                list.length
            )
        ];


    return {

        name: name,

        level: level,

        hp: hp,

        maxHp: hp,

        patk: patk,

        matk: matk,

        pdef: pdef,

        mdef: mdef,

        spd: spd,

        growthCore: growthCore,

        element: element

    };

}


/* =========================================================
   五隻野生御獸
========================================================= */

function showWildPets() {

    let cards = "";


    wildPets.forEach(
        (enemy, index) => {


            let coreNames =
                enemy.growthCore
                    .map(statName)
                    .join(" ＋ ");


            cards += `

                <div class="card enemy-card">

                    <h3>
                        ${enemy.name}
                    </h3>

                    <p>
                        Lv.${enemy.level}
                    </p>

                    <p>
                        ${elementData[enemy.element].name}
                    </p>

                    <div class="stat-grid">

                        <div class="stat">
                            ❤️ 生命：${enemy.hp}
                        </div>

                        <div class="stat">
                            ⚔️ 物攻：${enemy.patk}
                        </div>

                        <div class="stat">
                            🔮 魔攻：${enemy.matk}
                        </div>

                        <div class="stat">
                            🛡️ 物防：${enemy.pdef}
                        </div>

                        <div class="stat">
                            🧿 魔防：${enemy.mdef}
                        </div>

                        <div class="stat">
                            💨 速度：${enemy.spd}
                        </div>

                    </div>

                    <p class="growth">
                        🌱 成長核心：
                        ${coreNames}
                    </p>

                    <button
                        onclick="startBattle(${index})"
                    >
                        ⚔️ 開始戰鬥
                    </button>

                </div>

            `;

        }
    );


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="showRealms()">
                ← 返回秘境
            </button>

            <h2>
                ${elementData[currentRealm].realm}
            </h2>

            <p class="small">
                這個秘境出現了
                5 隻野生御獸。
                選擇你想挑戰的對象。
            </p>

        </div>

        <div class="grid">

            ${cards}

        </div>

    `;

}


/* =========================================================
   EXP上限
========================================================= */

function getExpMax(level) {

    if (level <= 10) {

        return 100 +
            (level - 1) * 10;

    }
    else if (level <= 20) {

        return 300 +
            (level - 11) * 50;

    }
    else if (level <= 30) {

        return 1000 +
            (level - 21) * 100;

    }
    else {

        return 4000 +
            (level - 31) * 500;

    }

}


/* =========================================================
   EXP
========================================================= */

function gainExp(amount) {

    pet.exp += amount;


    while (
        pet.exp >= pet.expMax
    ) {

        pet.exp -= pet.expMax;

        levelUp();

        pet.expMax =
            getExpMax(
                pet.level
            );

    }

}


/* =========================================================
   升級
========================================================= */

function levelUp() {

    pet.level++;


    pet.maxHp += 2;

    pet.hp =
        pet.maxHp;


    pet.patk++;

    pet.matk++;

    pet.pdef++;

    pet.mdef++;

    pet.spd++;

}


/* =========================================================
   戰鬥勝利後的六圍成長
========================================================= */

function applyBattleGrowth() {

    let rewards = [];


    /*
        敵人的兩個成長核心
        各讓對應六圍 +1。
    */

    for (
        let stat of currentEnemy.growthCore
    ) {

        if (stat === "hp") {

            pet.maxHp += 1;

            pet.hp += 1;

            rewards.push(
                "❤️ 生命 +1"
            );

        }
        else if (stat === "patk") {

            pet.patk += 1;

            rewards.push(
                "⚔️ 物理攻擊 +1"
            );

        }
        else if (stat === "matk") {

            pet.matk += 1;

            rewards.push(
                "🔮 魔法攻擊 +1"
            );

        }
        else if (stat === "pdef") {

            pet.pdef += 1;

            rewards.push(
                "🛡️ 物理防禦 +1"
            );

        }
        else if (stat === "mdef") {

            pet.mdef += 1;

            rewards.push(
                "🧿 魔法防禦 +1"
            );

        }
        else if (stat === "spd") {

            pet.spd += 1;

            rewards.push(
                "💨 速度 +1"
            );

        }

    }


    return rewards;

}


/* =========================================================
   元素正規化
========================================================= */

function normalizeElements() {

    let total = 0;


    for (
        let key in pet.elements
    ) {

        total +=
            pet.elements[key];

    }


    if (total === 0) {

        return;

    }


    for (
        let key in pet.elements
    ) {

        pet.elements[key] =
            pet.elements[key] /
            total *
            100;

    }

}


/* =========================================================
   使用素材
========================================================= */

function useMaterial(element) {

    if (
        materials[element] <= 0
    ) {

        alert("沒有這個素材！");

        return;

    }


    materials[element]--;


    /*
        第一次使用素材：

        100%該元素
    */

    if (
        getElementTotal() === 0
    ) {

        for (
            let key in pet.elements
        ) {

            pet.elements[key] = 0;

        }


        pet.elements[element] =
            100;

    }
    else {

        /*
            原有元素保留90%

            新元素增加10%
        */

        for (
            let key in pet.elements
        ) {

            pet.elements[key] *= 0.90;

        }


        pet.elements[element] +=
            10;


        normalizeElements();

    }


    showPet();

}


/* =========================================================
   元素總量
========================================================= */

function getElementTotal() {

    let total = 0;


    for (
        let key in pet.elements
    ) {

        total +=
            pet.elements[key];

    }


    return total;

}


/* =========================================================
   進化方向
========================================================= */

function getEvolutionType() {

    let list =
        Object.entries(
            pet.elements
        )
        .sort(
            (a, b) =>
                b[1] - a[1]
        );


    let top1 = list[0];

    let top2 = list[1];

    let top3 = list[2];


    if (
        top1[1] > 80
    ) {

        return `
            ${elementData[top1[0]].name}
            單屬性進化
        `;

    }


    if (

        top1[1] > 40 &&
        top2[1] > 40 &&
        top1[1] +
        top2[1] > 80

    ) {

        return `
            ${elementData[top1[0]].name}
            ＋
            ${elementData[top2[0]].name}
            雙屬性進化
        `;

    }


    if (

        top1[1] > 20 &&
        top2[1] > 20 &&
        top3[1] > 20 &&
        top1[1] +
        top2[1] +
        top3[1] > 80

    ) {

        return `
            ${elementData[top1[0]].name}
            ＋
            ${elementData[top2[0]].name}
            ＋
            ${elementData[top3[0]].name}
            三屬性進化
        `;

    }


    return "目前尚未形成明確進化方向";

}


/* =========================================================
   開始戰鬥
========================================================= */

function startBattle(index) {

    currentEnemy =
        wildPets[index];

    currentEnemyIndex =
        index;

    battleActive = true;

    logs = [];


    /*
        ★ 每次進入戰鬥雙方都滿血
    */

    pet.hp =
        pet.maxHp;

    currentEnemy.hp =
        currentEnemy.maxHp;


    addBattleLog(
        `⚔️ 遭遇 ${currentEnemy.name}！`
    );


    addBattleLog(
        `🐶 ${pet.name} Lv.${pet.level}`
    );


    addBattleLog(
        `👾 ${currentEnemy.name} Lv.${currentEnemy.level}`
    );


    addBattleLog(
        `🌱 成長核心：` +
        currentEnemy.growthCore
            .map(statName)
            .join(" ＋ ")
    );


    showBattle();


    /*
        敵人速度比較快：

        敵人先攻
    */

    if (
        currentEnemy.spd >
        pet.spd
    ) {

        setTimeout(
            () => {

                if (
                    battleActive
                ) {

                    enemyTurn();

                }

            },
            700
        );

    }

}


/* =========================================================
   傷害計算
========================================================= */

function calculateDamage(
    attacker,
    defender,
    type
) {

    let attack;

    let defense;


    if (
        type === "physical"
    ) {

        attack =
            attacker.patk;

        defense =
            defender.pdef;

    }
    else if (
        type === "magic"
    ) {

        attack =
            attacker.matk;

        defense =
            defender.mdef;

    }
    else {

        return {

            damage: 0,

            reflected: false,

            reflection: 0

        };

    }


    let difference =
        attack -
        defense;


    /*
        攻擊高於防禦
    */

    if (
        difference > 0
    ) {

        return {

            damage: difference,

            reflected: false,

            reflection: 0

        };

    }


    /*
        攻擊等於防禦
    */

    if (
        difference === 0
    ) {

        return {

            damage: 0,

            reflected: false,

            reflection: 0

        };

    }


    /*
        攻擊低於防禦：

        防禦者0傷害

        攻擊者受到自身攻擊力
        100%反傷
    */

    return {

        damage: 0,

        reflected: true,

        reflection: attack

    };

}


/* =========================================================
   玩家攻擊
========================================================= */

function playerAttack(type) {

    if (
        !battleActive
    ) {

        return;

    }


    let result =
        calculateDamage(
            pet,
            currentEnemy,
            type
        );


    currentEnemy.hp -=
        result.damage;


    let message =
        `🐶 ${pet.name} 使用` +
        `${
            type === "physical"
            ? "物攻"
            : "魔攻"
        }` +
        `，造成 ` +
        `${result.damage} 點傷害。`;


    if (
        result.reflected
    ) {

        pet.hp -=
            result.reflection;


        message +=
            ` 🛡️ 防禦反彈！` +
            `受到 ${result.reflection} 點反傷。`;

    }


    addBattleLog(message);


    if (
        currentEnemy.hp <= 0
    ) {

        victory();

        return;

    }


    if (
        pet.hp <= 0
    ) {

        defeat();

        return;

    }


    /*
        速度達到敵人1.5倍：

        本回合第二次攻擊
    */

    if (
        pet.spd >=
        currentEnemy.spd * 1.5
    ) {

        let secondResult =
            calculateDamage(
                pet,
                currentEnemy,
                type
            );


        currentEnemy.hp -=
            secondResult.damage;


        let secondMessage =
            `⚡ 速度優勢！再次攻擊，` +
            `造成 ${secondResult.damage} 點傷害。`;


        if (
            secondResult.reflected
        ) {

            pet.hp -=
                secondResult.reflection;


            secondMessage +=
                ` 🛡️ 防禦反彈！` +
                `受到 ${secondResult.reflection} 點反傷。`;

        }


        addBattleLog(
            secondMessage
        );


        if (
            currentEnemy.hp <= 0
        ) {

            victory();

            return;

        }


        if (
            pet.hp <= 0
        ) {

            defeat();

            return;

        }

    }


    enemyTurn();

}


/* =========================================================
   敵人選擇攻擊方式
========================================================= */

function chooseEnemyAttack() {

    let physical =
        calculateDamage(
            currentEnemy,
            pet,
            "physical"
        );


    let magic =
        calculateDamage(
            currentEnemy,
            pet,
            "magic"
        );


    if (
        physical.damage >=
        magic.damage
    ) {

        return "physical";

    }
    else {

        return "magic";

    }

}


/* =========================================================
   敵人攻擊
========================================================= */

function enemyTurn() {

    if (
        !battleActive
    ) {

        return;

    }


    let type =
        chooseEnemyAttack();


    let result =
        calculateDamage(
            currentEnemy,
            pet,
            type
        );


    pet.hp -=
        result.damage;


    let message =
        `👾 ${currentEnemy.name} 使用` +
        `${
            type === "physical"
            ? "物攻"
            : "魔攻"
        }` +
        `，造成 ` +
        `${result.damage} 點傷害。`;


    if (
        result.reflected
    ) {

        currentEnemy.hp -=
            result.reflection;


        message +=
            ` 🛡️ 防禦反彈！` +
            `${currentEnemy.name}` +
            `受到 ${result.reflection} 點反傷。`;

    }


    addBattleLog(message);


    if (
        currentEnemy.hp <= 0
    ) {

        victory();

        return;

    }


    if (
        pet.hp <= 0
    ) {

        defeat();

        return;

    }


    showBattle();

}


/* =========================================================
   防禦
========================================================= */

function defend() {

    if (
        !battleActive
    ) {

        return;

    }


    addBattleLog(
        "🛡️ 寵獸選擇防禦。"
    );


    enemyTurn();

}


/* =========================================================
   勝利
========================================================= */

function victory() {

    battleActive = false;


    /*
        EXP
    */

    let exp =
        25 +
        currentEnemy.level * 10;


    gainExp(exp);


    /*
        金幣
    */

    player.gold += 20;


    /*
        元素素材
    */

    materials[currentRealm]++;


    /*
        ★★★
        戰鬥成長

        依照被擊敗敵人的
        兩個成長核心，

        各讓主角六圍 +1。
    */

    let growthRewards =
        applyBattleGrowth();


    addBattleLog(
        "🎉 戰鬥勝利！"
    );


    addBattleLog(
        `✨ 獲得 ${exp} EXP`
    );


    addBattleLog(
        "💰 獲得 20 金幣"
    );


    addBattleLog(
        `🧪 獲得 1 個` +
        `${elementData[currentRealm].material}`
    );


    for (
        let reward of growthRewards
    ) {

        addBattleLog(
            `📈 戰鬥成長：${reward}`
        );

    }


    showBattleResult(
        "勝利",
        growthRewards
    );

}


/* =========================================================
   敗北
========================================================= */

function defeat() {

    battleActive = false;

    pet.hp = 0;


    showBattleResult(
        "敗北",
        []
    );

}


/* =========================================================
   戰鬥紀錄
========================================================= */

function addBattleLog(text) {

    logs.push(text);


    if (
        logs.length > 20
    ) {

        logs.shift();

    }

}


/* =========================================================
   戰鬥畫面
========================================================= */

function showBattle() {

    if (
        !currentEnemy
    ) {

        return;

    }


    let first = "你";


    if (
        currentEnemy.spd >
        pet.spd
    ) {

        first = "敵人";

    }


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="leaveBattle()">
                ← 放棄戰鬥
            </button>

            <h2>
                ⚔️
                ${elementData[currentRealm].realm}
            </h2>

            <div class="grid">

                <div class="card">

                    <h3>
                        🐶 ${pet.name}
                    </h3>

                    <p>
                        Lv.${pet.level}
                    </p>

                    <p>
                        ❤️
                        ${Math.max(
                            0,
                            pet.hp
                        )}
                        /
                        ${pet.maxHp}
                    </p>

                    <p>
                        ⚔️ ${pet.patk}
                       　
                        🔮 ${pet.matk}
                    </p>

                    <p>
                        🛡️ ${pet.pdef}
                       　
                        🧿 ${pet.mdef}
                    </p>

                    <p>
                        💨 ${pet.spd}
                    </p>

                </div>


                <div class="card">

                    <h3>
                        👾 ${currentEnemy.name}
                    </h3>

                    <p>
                        Lv.${currentEnemy.level}
                    </p>

                    <p>
                        ❤️
                        ${Math.max(
                            0,
                            currentEnemy.hp
                        )}
                        /
                        ${currentEnemy.maxHp}
                    </p>

                    <p>
                        ⚔️ ${currentEnemy.patk}
                       　
                        🔮 ${currentEnemy.matk}
                    </p>

                    <p>
                        🛡️ ${currentEnemy.pdef}
                       　
                        🧿 ${currentEnemy.mdef}
                    </p>

                    <p>
                        💨 ${currentEnemy.spd}
                    </p>

                    <p class="growth">
                        🌱 成長核心：
                        ${currentEnemy.growthCore
                            .map(statName)
                            .join(" ＋ ")}
                    </p>

                </div>

            </div>

            <p
                class="${
                    first === "你"
                    ? "good"
                    : "warning"
                }"
            >

                ⚡ ${first}先行動

            </p>

        </div>


        <div class="panel">

            <h3>🎮 行動</h3>

            <button
                onclick="playerAttack('physical')"
            >
                ⚔️ 物攻
            </button>

            <button
                onclick="playerAttack('magic')"
            >
                🔮 魔攻
            </button>

            <button
                onclick="defend()"
            >
                🛡️ 防禦
            </button>

        </div>


        <div class="panel">

            <h3>📜 戰鬥紀錄</h3>

            <div class="battle-log">

                ${logs.join("<br>")}

            </div>

        </div>

    `;

}


/* =========================================================
   離開戰鬥
========================================================= */

function leaveBattle() {

    battleActive = false;

    currentEnemy = null;

    showWildPets();

}


/* =========================================================
   戰鬥結果
========================================================= */

function showBattleResult(
    result,
    growthRewards
) {

    let growthHTML = "";


    if (
        result === "勝利"
    ) {

        growthHTML =
            growthRewards
                .map(
                    reward =>
                        `<p class="good">
                            📈 ${reward}
                        </p>`
                )
                .join("");

    }


    document.getElementById("app").innerHTML = `

        <div class="panel center">

            <h1>

                ${
                    result === "勝利"
                    ? "🎉 戰鬥勝利！"
                    : "💀 戰鬥失敗"
                }

            </h1>


            ${
                result === "勝利"

                ?

                `

                <p>
                    ${currentEnemy.name}
                    已被擊敗。
                </p>

                <div class="reward">

                    <h3>
                        🎁 戰鬥獎勵
                    </h3>

                    <p>
                        ✨ EXP
                        ${25 +
                            currentEnemy.level * 10}
                    </p>

                    <p>
                        💰 金幣 +20
                    </p>

                    <p>
                        🧪
                        ${elementData[currentRealm].material}
                        +1
                    </p>

                    <hr>

                    <h3>
                        📈 戰鬥成長
                    </h3>

                    ${growthHTML}

                </div>


                <button
                    onclick="showWildPets()"
                >
                    🗺️ 繼續挑戰其他御獸
                </button>


                <button
                    onclick="showRealms()"
                >
                    🌍 換一個秘境
                </button>


                <button
                    onclick="showPet()"
                >
                    🐶 查看寵獸
                </button>


                <button
                    onclick="showShop()"
                >
                    🏪 回到小舖
                </button>

                `

                :

                `

                <p class="danger">
                    寵獸倒下了。
                </p>

                <p>
                    本次冒險結束。
                </p>

                <button
                    onclick="restartGame()"
                >
                    🔄 重新開始
                </button>

                `

            }

        </div>


        <div class="panel">

            <h3>📜 戰鬥紀錄</h3>

            <div class="battle-log">

                ${logs.join("<br>")}

            </div>

        </div>

    `;

}


/* =========================================================
   素材庫
========================================================= */

function showMaterials() {

    let html = "";


    for (
        let key in materials
    ) {

        html += `

            <div class="item">

                <span>

                    ${elementData[key].name}

                    ${elementData[key].material}

                </span>

                <strong>
                    ×${materials[key]}
                </strong>

            </div>

        `;

    }


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="showShop()">
                ← 返回小舖
            </button>

            <h2>🎒 素材庫</h2>

            ${html}

        </div>

    `;

}


/* =========================================================
   寵獸
========================================================= */

function showPet() {

    let elementHTML = "";


    for (
        let key in pet.elements
    ) {

        if (
            pet.elements[key] > 0.01
        ) {

            elementHTML += `

                <span class="element">

                    ${elementData[key].name}

                    ${pet.elements[key].toFixed(1)}%

                </span>

            `;

        }

    }


    let expPercent =
        pet.exp /
        pet.expMax *
        100;


    let materialHTML = "";


    for (
        let key in materials
    ) {

        materialHTML += `

            <div class="item">

                <span>

                    ${elementData[key].name}

                    ${elementData[key].material}

                    ×${materials[key]}

                </span>


                <button
                    onclick="useMaterial('${key}')"
                    ${
                        materials[key] <= 0
                        ? "disabled"
                        : ""
                    }
                >

                    使用

                </button>

            </div>

        `;

    }


    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button onclick="showShop()">
                ← 返回小舖
            </button>

            <h2>
                🐶 ${pet.name}
            </h2>

            <p>

                Lv.${pet.level}

               　

                EXP
                ${pet.exp}
                /
                ${pet.expMax}

            </p>

            <div class="bar">

                <div
                    class="bar-fill"
                    style="
                        width:${expPercent}%;
                    "
                ></div>

            </div>

        </div>


        <div class="panel">

            <h2>📊 六圍</h2>

            <div class="stat-grid">

                <div class="stat">
                    ❤️
                    生命：
                    ${pet.hp}
                    /
                    ${pet.maxHp}
                </div>

                <div class="stat">
                    ⚔️
                    物理攻擊：
                    ${pet.patk}
                </div>

                <div class="stat">
                    🔮
                    魔法攻擊：
                    ${pet.matk}
                </div>

                <div class="stat">
                    🛡️
                    物理防禦：
                    ${pet.pdef}
                </div>

                <div class="stat">
                    🧿
                    魔法防禦：
                    ${pet.mdef}
                </div>

                <div class="stat">
                    💨
                    速度：
                    ${pet.spd}
                </div>

            </div>

        </div>


        <div class="panel">

            <h2>🧬 資質</h2>

            <p>
                固定資質：
                ${pet.aptitude.toFixed(2)}
            </p>

            <p class="small">
                資質在出生時決定，
                正常培育不會改變。
            </p>

        </div>


        <div class="panel">

            <h2>🌟 元素傾向</h2>

            ${
                elementHTML ||

                `
                <p class="small">
                    目前沒有任何元素傾向。
                </p>
                `
            }

            <hr>

            <p>
                <strong>
                    目前進化方向
                </strong>
            </p>

            <p class="warning">
                ${getEvolutionType()}
            </p>

        </div>


        <div class="panel">

            <h2>🧪 使用素材</h2>

            ${materialHTML}

        </div>

    `;

}


/* =========================================================
   六圍名稱
========================================================= */

function statName(stat) {

    const names = {

        hp: "生命",

        patk: "物理攻擊",

        matk: "魔法攻擊",

        pdef: "物理防禦",

        mdef: "魔法防禦",

        spd: "速度"

    };


    return names[stat];

}


/* =========================================================
   重新開始
========================================================= */

function restartGame() {

    location.reload();

}

</script>
